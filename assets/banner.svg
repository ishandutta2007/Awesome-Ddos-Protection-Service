<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes attackWave {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .pulsing-grid { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-shield { animation: float 4s infinite ease-in-out; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid pattern overlay in background -->
  <g class="pulsing-grid" opacity="0.15">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100,0 V350 M200,0 V350 M300,0 V350 M400,0 V350 M500,0 V350 M600,0 V350 M700,0 V350 M800,0 V350 M900,0 V350 M1000,0 V350 M1100,0 V350" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Geometric Abstract Dynamic Elements (Right side / background layer) -->
  <g opacity="0.25" class="floating-shield">
    <circle cx="980" cy="175" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="980" cy="175" r="90" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M980,85 L1050,120 V185 C1050,230 980,265 980,265 C980,265 910,230 910,185 V120 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Foreground Content (Left Aligned & Protected from overlap) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <rect x="0" y="65" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="115" y="86" class="tag" text-anchor="middle">🛡️ CURATED SECURITY LIST</text>

    <!-- Main Title -->
    <text x="0" y="150" class="title">Awesome DDoS Protection</text>
    
    <!-- Gradient accent line under title -->
    <rect x="0" y="168" width="520" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)" />

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">SaaS Platforms, Scrubbing Centers &amp; Open-Source Mitigation</text>
    <text x="0" y="245" class="subtitle" font-size="16" fill="#64748b">Volumetric Attack Defense • BGP FlowSpec • TLS &amp; L7 Mitigation</text>

    <!-- Stat Badges in SVG -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="80" y="20" font-family="system-ui" font-size="13" fill="#cbd5e1" text-anchor="middle">☁️ SaaS Solutions</text>

      <rect x="175" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="265" y="20" font-family="system-ui" font-size="13" fill="#cbd5e1" text-anchor="middle">🔓 Open-Source Tools</text>

      <rect x="370" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="450" y="20" font-family="system-ui" font-size="13" fill="#cbd5e1" text-anchor="middle">⚡ Real-time Defense</text>
    </g>
  </g>
</svg>
